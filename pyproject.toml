[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-tdsnr"
version = "0.2.0"
description = "批量 S 参数重归一化、时域响应与 SNR 分析工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10,<3.11",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "PyQt6>=6.9,<7; platform_system == 'Windows'",
    "qtpy>=2.4,<3",
    "scikit-rf>=1.6,<2",
    "scipy>=1.15,<2",
    "sipi-sparam-core>=0.1,<1",
    "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "pyinstaller>=6,<7",
]

[project.scripts]
qts = "quick_tdsnr.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
